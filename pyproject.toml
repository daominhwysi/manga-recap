[project]
name = "manga-recap-generator"
version = "0.2.0"
description = "Modular multi-agent AI pipeline for automated manga and manhwa recap videos"
requires-python = ">=3.11"
dependencies = [
    "edge-tts>=7.0.0",
    "huggingface-hub>=0.25.0",
    "httpx>=0.27.0",
    "imageio-ffmpeg>=0.5.1",
    "libtorrent>=2.1.1",
    "numpy>=2.0.0",
    "onnxruntime>=1.19.0",
    "openai>=1.50.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.2",
    "rich>=13.9.0",
    "soundfile>=0.12.1",
    "typer>=0.12.5",
    "vieneu",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
manga-recap = "src.cli:app"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
